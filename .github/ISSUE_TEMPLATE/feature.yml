name: Feature request
description: Propose a scoped improvement to the Tanikala ecosystem.
title: "[Feature] "
body:
  - type: dropdown
    id: app
    attributes:
      label: Application
      options:
        - Tanikala API
        - Tanikala UI
        - Aral
        - Convos
        - Pondo
        - Sulat
        - Ecosystem or shared platform
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational need should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing unnecessary implementation detail.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link relevant PRC sources, designs, contracts, discussions, or related issues.
